# fitness 生产 nginx 配置样例
# 放置：/etc/nginx/conf.d/fitness.conf
# 结构：API 反代 → 127.0.0.1:8080；admin-web 静态 → /var/www/fitness-admin；
#       H5 用户端静态（history 路由，需 try_files 回退）→ /var/www/fitness-web；
#       课程视频静态 → /var/www/videos（config.video.base_url 指向 https://DOMAIN/videos）

server {
    listen 80;
    server_name your-domain.com;
    # 上线先跑 HTTP + certbot 签发，成功后启用下方 443 段并加 301
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # ---- 后端 API（小程序端 + 管理后台 API）----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 课程介绍视频上传：单独放宽请求体上限（与 video.max_mb 对齐），
    # nginx 默认先缓冲完整请求体，大文件会占用 /var/lib/nginx/body 临时空间
    location = /admin/api/v1/uploads/video {
        client_max_body_size 300m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 管理后台静态（hash 路由，无需 try_files 回退）----
    location /admin/ {
        alias /var/www/fitness-admin/;
        index index.html;
        expires 1h;
    }
    # 入口 HTML 不缓存：否则重新部署后浏览器仍用旧 index.html 引用旧 assets
    location = /admin/index.html {
        alias /var/www/fitness-admin/index.html;
        add_header Cache-Control "no-store";
    }

    # ---- H5 用户端静态（uni-app history 路由，回退 index.html）----
    location / {
        root /var/www/fitness-web;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
    location = /index.html {
        root /var/www/fitness-web;
        add_header Cache-Control "no-store";
    }

    # ---- 课程介绍视频静态目录 ----
    location /videos/ {
        alias /var/www/videos/;
        expires 7d;
    }

    # ---- 用户上传图片（评价图等；与 server.upload.dir 同一目录，只读直出）----
    location /uploads/ {
        alias /var/www/fitness/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 健康检查 ----
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }
}
